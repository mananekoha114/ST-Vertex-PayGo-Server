name: Host streaming
on:
  push:
    paths: ['src/**', 'index.cjs', 'test/host-streaming.test.cjs', 'package.json', '.github/workflows/host-streaming.yml']
  pull_request:
    paths: ['src/**', 'index.cjs', 'test/host-streaming.test.cjs', 'package.json', '.github/workflows/host-streaming.yml']
  workflow_dispatch:
jobs:
  host-streaming:
    name: SillyTavern ${{ matrix.sillytavern }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        sillytavern: ['1.16.0', '1.17.0', '1.18.0']
        node: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SillyTavern/SillyTavern
          ref: ${{ matrix.sillytavern }}
          path: host
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install SillyTavern dependencies
        working-directory: host
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run the plugin inside the SillyTavern express stack
        run: npm run test:host-streaming
        env:
          PAYGO_ST_ROOT: host
          PAYGO_REQUIRE_HOST: '1'
